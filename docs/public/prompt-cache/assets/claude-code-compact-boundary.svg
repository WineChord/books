<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code compact boundary model view</title>
  <desc id="desc">A source-level diagram showing compact_boundary as the model-view boundary while the local transcript remains complete.</desc>
  <defs>
    <style>
      .bg { fill: #fbfcf8; }
      .title { fill: #102a43; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #486581; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #ffffff; stroke: #1f5f8b; stroke-width: 1.6; rx: 12; }
      .soft { fill: #f5f3ff; stroke: #6b46c1; stroke-width: 1.6; rx: 12; }
      .green { fill: #f1fbf4; stroke: #2f855a; stroke-width: 1.6; rx: 12; }
      .yellow { fill: #fff8e1; stroke: #b7791f; stroke-width: 1.6; rx: 12; }
      .muted { fill: #edf2f7; stroke: #9fb3c8; stroke-width: 1.4; rx: 10; }
      .label { fill: #102a43; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #334e68; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #334e68; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .arrow { stroke: #486581; stroke-width: 2; marker-end: url(#arrow); fill: none; }
      .thin { stroke: #9fb3c8; stroke-width: 1.4; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#486581"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text class="title" x="48" y="52">compact_boundary：切的是模型视图，不是本地历史</text>
  <text class="subtitle" x="48" y="82">对应 compact slice、SNIP projection 和 API normalization 三步。</text>

  <text class="label" x="70" y="132">本地 transcript 继续保留完整链</text>
  <rect class="box" x="70" y="154" width="160" height="52"/>
  <text class="mono" x="104" y="186">turn 1</text>
  <rect class="box" x="70" y="224" width="160" height="52"/>
  <text class="mono" x="104" y="256">turn 2</text>
  <rect class="box" x="70" y="294" width="160" height="52"/>
  <text class="mono" x="104" y="326">turn 3</text>
  <rect class="yellow" x="70" y="364" width="300" height="58"/>
  <text class="mono" x="94" y="388">system: compact_boundary</text>
  <text class="mono" x="94" y="410">metadata: summary + userContext</text>
  <rect class="green" x="70" y="442" width="210" height="52"/>
  <text class="mono" x="96" y="474">summary message</text>
  <rect class="box" x="70" y="512" width="160" height="52"/>
  <text class="mono" x="104" y="544">turn 4</text>
  <path class="thin" d="M 150 206 V 224"/>
  <path class="thin" d="M 150 276 V 294"/>
  <path class="thin" d="M 150 346 V 364"/>
  <path class="thin" d="M 150 422 V 442"/>
  <path class="thin" d="M 150 494 V 512"/>

  <text class="label" x="520" y="132">请求前投影成模型视图</text>
  <rect class="soft" x="520" y="158" width="300" height="58"/>
  <text class="mono" x="544" y="182">findLastCompactBoundary...</text>
  <text class="body" x="544" y="204">找到最后一个 boundary</text>
  <path class="arrow" d="M 820 187 H 874"/>
  <rect class="soft" x="874" y="158" width="248" height="58"/>
  <text class="mono" x="898" y="182">messages.slice(index)</text>
  <text class="body" x="898" y="204">只取 boundary 之后</text>

  <path class="arrow" d="M 998 216 V 268"/>
  <rect class="green" x="840" y="268" width="282" height="72"/>
  <text class="mono" x="864" y="292">projectSnippedView()</text>
  <text class="body" x="864" y="316">HISTORY_SNIP 打开时，再过滤</text>
  <text class="body" x="864" y="334">removedUuids 指向的消息</text>

  <path class="arrow" d="M 981 340 V 392"/>
  <rect class="box" x="810" y="392" width="312" height="76"/>
  <text class="mono" x="834" y="418">normalizeForAPI()</text>
  <text class="body" x="834" y="442">boundary 是 system message，</text>
  <text class="body" x="834" y="462">最终不会作为普通消息进 API</text>

  <path class="arrow" d="M 810 430 H 454"/>
  <rect class="green" x="454" y="388" width="270" height="116"/>
  <text class="label" x="482" y="422">模型实际看到</text>
  <text class="mono" x="482" y="452">summary message</text>
  <text class="mono" x="482" y="474">turn 4</text>
  <text class="mono" x="482" y="496">后续最新 turn...</text>

  <path class="arrow" d="M 370 393 C 438 388 470 300 560 216"/>
  <text class="body" x="394" y="336">boundary 让 summary 覆盖旧前缀，</text>
  <text class="body" x="394" y="358">同时保留 UI scrollback 和恢复能力。</text>
</svg>
