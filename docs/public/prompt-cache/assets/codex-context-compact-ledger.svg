<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Codex context and compaction ledger</title>
  <desc id="desc">A clean diagram of prompt_cache_key, initial context, TurnContextItem, for_prompt, CompactedItem, and rollout reconstruction.</desc>
  <defs>
    <style>
      .bg { fill: #fbfcf8; }
      .title { fill: #102a43; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #486581; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #ffffff; stroke: #1f5f8b; stroke-width: 1.6; rx: 12; }
      .green { fill: #f1fbf4; stroke: #2f855a; stroke-width: 1.6; rx: 12; }
      .yellow { fill: #fff8e1; stroke: #b7791f; stroke-width: 1.6; rx: 12; }
      .purple { fill: #f5f3ff; stroke: #6b46c1; stroke-width: 1.6; rx: 12; }
      .soft { fill: #edf2f7; stroke: #9fb3c8; stroke-width: 1.4; rx: 10; }
      .label { fill: #102a43; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #334e68; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #334e68; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .arrow { stroke: #486581; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#486581"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text class="title" x="48" y="52">Codex：自动 prefix cache 下的可恢复历史</text>
  <text class="subtitle" x="48" y="82">重点不是显式 breakpoint，而是稳定 cache key、上下文基线和 replacement_history。</text>

  <rect class="green" x="58" y="126" width="242" height="94"/>
  <text class="label" x="82" y="158">prompt_cache_key</text>
  <text class="mono" x="82" y="186">session thread id</text>
  <text class="body" x="82" y="206">稳定缓存域</text>
  <path class="arrow" d="M 300 173 H 350"/>

  <rect class="box" x="350" y="112" width="270" height="122"/>
  <text class="label" x="374" y="144">initial context</text>
  <text class="mono" x="374" y="172">AGENTS.md</text>
  <text class="mono" x="374" y="194">sandbox / approval / env</text>
  <text class="body" x="374" y="216">后续 turn 尽量发 diff。</text>
  <path class="arrow" d="M 620 173 H 670"/>

  <rect class="yellow" x="670" y="112" width="232" height="122"/>
  <text class="label" x="694" y="144">TurnContextItem</text>
  <text class="mono" x="694" y="172">真实 user turn 持久化</text>
  <text class="mono" x="694" y="194">mid-turn compact 后也写</text>
  <text class="body" x="694" y="216">resume / fork 的基线。</text>
  <path class="arrow" d="M 902 173 H 952"/>

  <rect class="box" x="952" y="126" width="190" height="94"/>
  <text class="label" x="976" y="158">for_prompt()</text>
  <text class="mono" x="976" y="186">normalize</text>
  <text class="body" x="976" y="206">截断模型可见输出</text>

  <rect class="purple" x="58" y="342" width="286" height="118"/>
  <text class="label" x="82" y="374">CompactedItem</text>
  <text class="mono" x="82" y="402">replacement_history</text>
  <text class="body" x="82" y="428">最近 user messages + summary</text>
  <text class="body" x="82" y="448">直接成为新的模型历史。</text>
  <path class="arrow" d="M 344 401 H 394"/>

  <rect class="soft" x="394" y="318" width="250" height="166"/>
  <text class="label" x="418" y="350">rollout JSONL</text>
  <text class="mono" x="418" y="378">SessionMeta</text>
  <text class="mono" x="418" y="402">ResponseItem...</text>
  <text class="mono" x="418" y="426">TurnContext</text>
  <text class="mono" x="418" y="450">Compacted(...)</text>
  <path class="arrow" d="M 644 401 H 694"/>

  <rect class="green" x="694" y="342" width="254" height="118"/>
  <text class="label" x="718" y="374">rollout reconstruction</text>
  <text class="mono" x="718" y="402">newest-to-oldest scan</text>
  <text class="body" x="718" y="428">最新 replacement checkpoint</text>
  <text class="body" x="718" y="448">优先成为恢复 baseline。</text>
  <path class="arrow" d="M 948 401 H 998"/>

  <rect class="box" x="998" y="342" width="144" height="118"/>
  <text class="label" x="1022" y="374">next turn</text>
  <text class="mono" x="1022" y="402">same key</text>
  <text class="mono" x="1022" y="424">stable shape</text>
  <text class="mono" x="1022" y="446">small diff</text>

  <text class="body" x="58" y="548">和 Claude Code 的 compact_boundary 不同：Codex compaction 后安装的是 replacement_history，resume 时直接使用替换后的模型历史。</text>
</svg>
