<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code request-time context pipeline</title>
  <desc id="desc">A clean pipeline for the Claude Code request path: derive model view, reduce pressure, add context, and place cache control.</desc>
  <defs>
    <style>
      .bg { fill: #fbfcf8; }
      .title { fill: #102a43; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #486581; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .band { fill: #ffffff; stroke: #d9e2ec; stroke-width: 1.4; rx: 18; }
      .box { fill: #ffffff; stroke: #1f5f8b; stroke-width: 1.6; rx: 12; }
      .green { fill: #f1fbf4; stroke: #2f855a; stroke-width: 1.6; rx: 12; }
      .yellow { fill: #fff8e1; stroke: #b7791f; stroke-width: 1.6; rx: 12; }
      .purple { fill: #f5f3ff; stroke: #6b46c1; stroke-width: 1.6; rx: 12; }
      .red { fill: #fff5f5; stroke: #c53030; stroke-width: 1.6; rx: 12; }
      .label { fill: #102a43; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #334e68; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #334e68; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .num { fill: #ffffff; font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .badge { fill: #1f5f8b; }
      .arrow { stroke: #486581; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#486581"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="640"/>
  <text class="title" x="48" y="52">Claude Code：一次请求里的上下文处理顺序</text>
  <text class="subtitle" x="48" y="82">先构造模型视图，再逐层减压，最后才补基础 context 和 cache_control。</text>

  <rect class="band" x="48" y="120" width="1104" height="134"/>
  <circle class="badge" cx="82" cy="152" r="15"/><text class="num" x="78" y="157">1</text>
  <text class="label" x="108" y="158">从完整历史得到本轮候选视图</text>
  <rect class="box" x="86" y="178" width="205" height="52"/>
  <text class="mono" x="110" y="202">messages</text><text class="body" x="110" y="222">append-only transcript</text>
  <path class="arrow" d="M 291 204 H 335"/>
  <rect class="box" x="335" y="178" width="265" height="52"/>
  <text class="mono" x="359" y="202">getMessagesAfterCompactBoundary()</text><text class="body" x="359" y="222">切到最后 compact_boundary</text>
  <path class="arrow" d="M 600 204 H 644"/>
  <rect class="purple" x="644" y="178" width="218" height="52"/>
  <text class="mono" x="668" y="202">projectSnippedView()</text><text class="body" x="668" y="222">过滤已 snip 内容</text>
  <path class="arrow" d="M 862 204 H 906"/>
  <rect class="green" x="906" y="178" width="198" height="52"/>
  <text class="mono" x="930" y="202">messagesForQuery</text><text class="body" x="930" y="222">不是 UI 全量历史</text>

  <rect class="band" x="48" y="286" width="1104" height="150"/>
  <circle class="badge" cx="82" cy="318" r="15"/><text class="num" x="78" y="323">2</text>
  <text class="label" x="108" y="324">在模型候选视图上逐层减压</text>
  <rect class="yellow" x="86" y="348" width="190" height="58"/>
  <text class="mono" x="110" y="372">tool result budget</text><text class="body" x="110" y="392">大结果落盘 / preview</text>
  <path class="arrow" d="M 276 377 H 318"/>
  <rect class="purple" x="318" y="348" width="150" height="58"/>
  <text class="mono" x="342" y="372">snip</text><text class="body" x="342" y="392">中段投影</text>
  <path class="arrow" d="M 468 377 H 510"/>
  <rect class="box" x="510" y="348" width="168" height="58"/>
  <text class="mono" x="534" y="372">microcompact</text><text class="body" x="534" y="392">清旧工具结果</text>
  <path class="arrow" d="M 678 377 H 720"/>
  <rect class="purple" x="720" y="348" width="184" height="58"/>
  <text class="mono" x="744" y="372">context-collapse</text><text class="body" x="744" y="392">摘要投影</text>
  <path class="arrow" d="M 904 377 H 946"/>
  <rect class="red" x="946" y="348" width="158" height="58"/>
  <text class="mono" x="970" y="372">autocompact</text><text class="body" x="970" y="392">最后摘要</text>

  <rect class="band" x="48" y="468" width="1104" height="112"/>
  <circle class="badge" cx="82" cy="500" r="15"/><text class="num" x="78" y="505">3</text>
  <text class="label" x="108" y="506">发 API 前补稳定 context，并放显式缓存点</text>
  <rect class="green" x="86" y="526" width="230" height="38"/>
  <text class="mono" x="110" y="550">prependUserContext()</text>
  <path class="arrow" d="M 316 545 H 358"/>
  <rect class="box" x="358" y="526" width="260" height="38"/>
  <text class="mono" x="382" y="550">memoized CLAUDE.md context</text>
  <path class="arrow" d="M 618 545 H 660"/>
  <rect class="yellow" x="660" y="526" width="228" height="38"/>
  <text class="mono" x="684" y="550">addCacheBreakpoints()</text>
  <path class="arrow" d="M 888 545 H 930"/>
  <rect class="green" x="930" y="526" width="174" height="38"/>
  <text class="mono" x="954" y="550">Claude API request</text>

  <text class="body" x="48" y="612">关键点：这些步骤维护的是“模型看到的历史”。UI scrollback 和磁盘 transcript 可以更完整。</text>
</svg>
