<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code large tool result persistence</title>
  <desc id="desc">A clean diagram showing how oversized tool results are persisted and replaced with stable previews.</desc>
  <defs>
    <style>
      .bg { fill: #fbfcf8; }
      .title { fill: #102a43; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #486581; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box { fill: #ffffff; stroke: #1f5f8b; stroke-width: 1.6; rx: 12; }
      .green { fill: #f1fbf4; stroke: #2f855a; stroke-width: 1.6; rx: 12; }
      .yellow { fill: #fff8e1; stroke: #b7791f; stroke-width: 1.6; rx: 12; }
      .soft { fill: #edf2f7; stroke: #9fb3c8; stroke-width: 1.4; rx: 10; }
      .label { fill: #102a43; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #334e68; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #334e68; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .arrow { stroke: #486581; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#486581"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="560"/>
  <text class="title" x="48" y="52">Claude Code：大工具结果先落盘，再进入模型视图</text>
  <text class="subtitle" x="48" y="82">对应 Tool.ts、toolResultStorage.ts 和 toolLimits.ts。</text>

  <rect class="box" x="58" y="134" width="206" height="92"/>
  <text class="label" x="82" y="164">tool_result 原文</text>
  <text class="mono" x="82" y="192">stdout / JSON / grep</text>
  <text class="body" x="82" y="212">可能几十 KB 到数 MB</text>
  <path class="arrow" d="M 264 180 H 314"/>

  <rect class="yellow" x="314" y="118" width="238" height="124"/>
  <text class="label" x="338" y="148">阈值判断</text>
  <text class="mono" x="338" y="176">Bash: 30k chars</text>
  <text class="mono" x="338" y="198">Grep: 20k chars</text>
  <text class="mono" x="338" y="220">default: 100k chars</text>
  <path class="arrow" d="M 552 180 H 602"/>

  <rect class="green" x="602" y="118" width="250" height="124"/>
  <text class="label" x="626" y="148">persistToolResult()</text>
  <text class="mono" x="626" y="176">tool-results/</text>
  <text class="mono" x="626" y="198">{tool_use_id}.txt</text>
  <text class="mono" x="626" y="220">or .json</text>
  <path class="arrow" d="M 852 180 H 902"/>

  <rect class="box" x="902" y="118" width="240" height="124"/>
  <text class="label" x="926" y="148">模型看到 preview</text>
  <text class="mono" x="926" y="176">&lt;persisted-output&gt;</text>
  <text class="mono" x="926" y="198">path + size</text>
  <text class="mono" x="926" y="220">first 2KB preview</text>

  <rect class="soft" x="58" y="310" width="322" height="118"/>
  <text class="label" x="82" y="342">同一条 user message 的总预算</text>
  <text class="mono" x="82" y="372">MAX_TOOL_RESULTS_PER_MESSAGE_CHARS</text>
  <text class="mono" x="82" y="394">= 200,000</text>
  <text class="body" x="82" y="416">超过时优先处理最大的 fresh result。</text>
  <path class="arrow" d="M 380 369 H 438"/>

  <rect class="green" x="438" y="294" width="342" height="150"/>
  <text class="label" x="462" y="326">ContentReplacementState</text>
  <text class="mono" x="462" y="356">seenIds: Set&lt;tool_use_id&gt;</text>
  <text class="mono" x="462" y="378">replacements: Map&lt;id, preview&gt;</text>
  <text class="body" x="462" y="406">同一个 tool_use_id 的替换结果固定下来，</text>
  <text class="body" x="462" y="426">后续请求复用同一段 preview。</text>
  <path class="arrow" d="M 780 369 H 838"/>

  <rect class="yellow" x="838" y="310" width="304" height="118"/>
  <text class="label" x="862" y="342">缓存影响</text>
  <text class="body" x="862" y="372">旧工具结果的模型可见文本保持稳定。</text>
  <text class="body" x="862" y="396">需要全文时，模型可根据路径再读。</text>
  <text class="body" x="862" y="420">这比每轮重新截断更利于 prefix cache。</text>

  <text class="body" x="58" y="508">这层机制发生在 snip 和 microcompact 之前，解决的是新鲜大结果撑爆模型视图的问题。</text>
</svg>
