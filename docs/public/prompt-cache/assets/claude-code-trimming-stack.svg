<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code snip microcompact context-collapse autocompact stack</title>
  <desc id="desc">A layered diagram explaining snip, microcompact, context-collapse, and autocompact with source-visible contracts.</desc>
  <defs>
    <style>
      .bg { fill: #fbfcf8; }
      .title { fill: #102a43; font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #486581; font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .lane { fill: #ffffff; stroke: #bcccdc; stroke-width: 1.5; rx: 18; }
      .tag { fill: #102a43; font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #334e68; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #334e68; font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .chip { fill: #e6f6ff; stroke: #1f5f8b; stroke-width: 1.5; rx: 12; }
      .chip2 { fill: #f1fbf4; stroke: #2f855a; stroke-width: 1.5; rx: 12; }
      .chip3 { fill: #fff8e1; stroke: #b7791f; stroke-width: 1.5; rx: 12; }
      .chip4 { fill: #f5f3ff; stroke: #6b46c1; stroke-width: 1.5; rx: 12; }
      .arrow { stroke: #486581; stroke-width: 3; marker-end: url(#arrow); fill: none; }
      .dash { stroke: #829ab1; stroke-width: 2; stroke-dasharray: 8 8; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#486581"/>
    </marker>
  </defs>
  <rect class="bg" width="1400" height="660"/>
  <text class="title" x="54" y="58">Claude Code：四种“变小”机制不是同一件事</text>
  <text class="subtitle" x="54" y="90">它们按位置、触发条件和持久化语义区分；越靠下越像完整压缩。</text>

  <rect class="lane" x="62" y="126" width="1276" height="104"/>
  <text class="tag" x="92" y="162">SNIP</text>
  <text class="body" x="92" y="188">剪掉中段历史的模型投影；UI 可保留完整 scrollback。</text>
  <text class="body" x="92" y="210">恢复时不能只删除，还要把 parentUuid 跨过缺口重新接上。</text>
  <rect class="chip4" x="674" y="148" width="188" height="54"/>
  <text class="mono" x="696" y="171">API [id:...]</text>
  <text class="mono" x="696" y="191">stable short id</text>
  <rect class="chip4" x="890" y="148" width="190" height="54"/>
  <text class="mono" x="912" y="171">projectSnippedView()</text>
  <text class="mono" x="912" y="191">model path only</text>
  <rect class="chip4" x="1108" y="148" width="184" height="54"/>
  <text class="mono" x="1130" y="171">removedUuids</text>
  <text class="mono" x="1130" y="191">parentUuid relink</text>

  <rect class="lane" x="62" y="252" width="1276" height="120"/>
  <text class="tag" x="92" y="288">MICROCOMPACT</text>
  <text class="body" x="92" y="318">只清理旧工具结果，不摘要整个对话。时间型路径会直接把旧结果替换成固定文本；缓存型路径使用 cache_edits 和 cache_reference。</text>
  <rect class="chip" x="802" y="270" width="224" height="68"/>
  <text class="mono" x="824" y="294">time-based path</text>
  <text class="mono" x="824" y="316">[Old tool result</text>
  <text class="mono" x="824" y="336"> content cleared]</text>
  <rect class="chip" x="1052" y="270" width="240" height="68"/>
  <text class="mono" x="1074" y="294">cached path</text>
  <text class="mono" x="1074" y="316">cache_edits</text>
  <text class="mono" x="1074" y="336">cache_reference</text>

  <rect class="lane" x="62" y="394" width="1276" height="104"/>
  <text class="tag" x="92" y="430">CONTEXT-COLLAPSE</text>
  <text class="body" x="92" y="460">在请求前把一段历史投影成摘要占位。可见源码包含 query.ts 接入、sessionStorage 持久化、commit/snapshot 类型；具体实现模块在这份快照中未展开。</text>
  <rect class="chip2" x="830" y="416" width="204" height="54"/>
  <text class="mono" x="852" y="439">record commit</text>
  <text class="mono" x="852" y="459">collapseId + summary</text>
  <rect class="chip2" x="1062" y="416" width="230" height="54"/>
  <text class="mono" x="1084" y="439">projectView()</text>
  <text class="mono" x="1084" y="459">before autocompact</text>

  <rect class="lane" x="62" y="520" width="1276" height="104"/>
  <text class="tag" x="92" y="556">AUTOCOMPACT</text>
  <text class="body" x="92" y="586">最后一级保护。窗口逼近阈值时生成完整 summary，写 compact_boundary；同时预留 summary 输出 token，并有连续失败 circuit breaker。</text>
  <rect class="chip3" x="814" y="542" width="220" height="54"/>
  <text class="mono" x="836" y="565">shouldAutoCompact()</text>
  <text class="mono" x="836" y="585">snipTokensFreed</text>
  <rect class="chip3" x="1062" y="542" width="230" height="54"/>
  <text class="mono" x="1084" y="565">compactConversation()</text>
  <text class="mono" x="1084" y="585">compact_boundary</text>

  <path class="arrow" d="M 700 230 V 252"/>
  <path class="arrow" d="M 700 372 V 394"/>
  <path class="arrow" d="M 700 498 V 520"/>
  <path class="dash" d="M 128 214 C 126 286 126 412 128 536"/>
  <text class="mono" x="154" y="642">从上到下：中段剪裁 → 工具结果瘦身 → 摘要投影视图 → 完整会话摘要。它们都服务于同一个目标：让模型视图在预算内并尽量稳定。</text>
</svg>
