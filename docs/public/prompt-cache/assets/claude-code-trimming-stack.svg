<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code context shrinking mechanisms</title>
  <desc id="desc">A layered table of large-result persistence, snip, microcompact, context-collapse, and autocompact.</desc>
  <defs>
    <style>
      .bg { fill: #fbfcf8; }
      .title { fill: #102a43; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #486581; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .row { fill: #ffffff; stroke: #d9e2ec; stroke-width: 1.4; rx: 14; }
      .blue { fill: #e6f6ff; stroke: #1f5f8b; stroke-width: 1.4; rx: 10; }
      .purple { fill: #f5f3ff; stroke: #6b46c1; stroke-width: 1.4; rx: 10; }
      .green { fill: #f1fbf4; stroke: #2f855a; stroke-width: 1.4; rx: 10; }
      .yellow { fill: #fff8e1; stroke: #b7791f; stroke-width: 1.4; rx: 10; }
      .label { fill: #102a43; font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #334e68; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #334e68; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .arrow { stroke: #486581; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#486581"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="640"/>
  <text class="title" x="48" y="52">Claude Code：多层上下文减压，不是一种 compaction</text>
  <text class="subtitle" x="48" y="82">越靠下越接近完整摘要；越靠上越局部、越便宜。</text>

  <rect class="row" x="58" y="120" width="1084" height="82"/>
  <rect class="blue" x="82" y="140" width="190" height="42"/><text class="label" x="104" y="166">大结果落盘</text>
  <text class="body" x="310" y="150">处理对象：单个或同一条消息里的巨大 tool_result。</text>
  <text class="body" x="310" y="174">模型可见：路径 + 体积 + 固定 preview；完整输出在磁盘。</text>
  <text class="mono" x="840" y="164">tool_use_id → stable preview</text>

  <rect class="row" x="58" y="218" width="1084" height="82"/>
  <rect class="purple" x="82" y="238" width="190" height="42"/><text class="label" x="104" y="264">SNIP</text>
  <text class="body" x="310" y="246">处理对象：不再值得进入模型视图的中段消息。</text>
  <text class="body" x="310" y="268">恢复关键：boundary 记录 removedUuids，</text>
  <text class="body" x="310" y="290">resume 时按 parentUuid 重接链条。</text>
  <text class="mono" x="840" y="262">[id:...] → removedUuids</text>

  <rect class="row" x="58" y="316" width="1084" height="82"/>
  <rect class="blue" x="82" y="336" width="190" height="42"/><text class="label" x="104" y="362">Microcompact</text>
  <text class="body" x="310" y="346">处理对象：旧工具结果的可见体积。</text>
  <text class="body" x="310" y="370">两条路径：time-based 直接清文本；cached 路径使用 cache_edits。</text>
  <text class="mono" x="840" y="360">tool_result cleanup</text>

  <rect class="row" x="58" y="414" width="1084" height="82"/>
  <rect class="green" x="82" y="434" width="190" height="42"/><text class="label" x="104" y="460">Context-collapse</text>
  <text class="body" x="310" y="444">处理对象：一段历史的 read-time summary projection。</text>
  <text class="body" x="310" y="466">契约：query 接入，commit/snapshot 持久化，</text>
  <text class="body" x="310" y="488">resume 时重新投影。</text>
  <text class="mono" x="840" y="458">projectView() before auto</text>

  <rect class="row" x="58" y="512" width="1084" height="82"/>
  <rect class="yellow" x="82" y="532" width="190" height="42"/><text class="label" x="104" y="558">Autocompact</text>
  <text class="body" x="310" y="542">处理对象：上下文窗口逼近上限后的完整会话摘要。</text>
  <text class="body" x="310" y="564">产物：summary + compact_boundary；</text>
  <text class="body" x="310" y="586">后续请求从 boundary 后切模型视图。</text>
  <text class="mono" x="840" y="556">compact_boundary</text>

  <path class="arrow" d="M 600 202 V 218"/>
  <path class="arrow" d="M 600 300 V 316"/>
  <path class="arrow" d="M 600 398 V 414"/>
  <path class="arrow" d="M 600 496 V 512"/>
</svg>
